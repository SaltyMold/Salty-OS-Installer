name: Sync releases
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les dernières releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo SaltyMold/Salty-OS --pattern 'userland.onboarding.allow3rdparty.B.*.dfu' --dir assets --clobber
          gh release download --repo SaltyMold/ABLauncher-Numworks --pattern '*.nwa' --dir assets --clobber
      - name: Commit si changement
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m "Sync releases" && git push)