<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salty Installer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>

<style>
:root{
  --bg:#161818;--panel:#232424;--panel2:#2c2d2d;--ink:#dadbdb;--mute:#9b9d9d;--line:#383a3a;
  --acc:#2f7dc0;--acc-d:#256aa5;--acc-s:rgba(47,125,192,.2);--acc-t:#7ab8ee;--ok:#2fb67c;
  --logo:#ffb734;--r:20px;color-scheme:dark;--okt:#3ecf8e;--bad:#ff6369;--bad-s:rgba(255,99,105,.14);--ok-s:rgba(47,182,124,.15);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root[data-theme=light]{
  --bg:#f2f3f3;--panel:#fff;--panel2:#ebecec;--ink:#1f2222;--mute:#666a6a;--line:#dcdede;
  --acc-s:rgba(47,125,192,.13);--acc-t:#256aa5;color-scheme:light;--okt:#177a50;--bad:#d1242f;--bad-s:rgba(209,36,47,.1);--ok-s:rgba(23,122,80,.12);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Rubik,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;font-weight:600;background:var(--acc);color:#fff;transition:filter .12s,background .12s}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}
button.ghost{background:var(--acc-s);color:var(--acc-t)}
button.ghost:disabled{background:var(--line);color:var(--mute)}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}
a{color:var(--acc-t)}
.sp{flex:1}
.wrap{max-width:1500px;margin:0 auto;padding:0 clamp(16px,3.5vw,44px)}

/* ===== En-tête ===== */
.top{padding:18px 0 22px}
.top .wrap{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.logo{font-size:27px;font-weight:700;letter-spacing:-.02em;color:var(--logo);margin-right:14px;line-height:1}
nav{display:flex;gap:2px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--mute);padding:7px 11px;font-weight:500;font-size:15px;border-radius:9px}
.tab:hover:not(:disabled){background:var(--panel);color:var(--ink);filter:none}
.tab[aria-selected=true]{background:var(--panel2);color:var(--ink);font-weight:600}
.tab svg{flex:none}
.gh{position:relative}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:240px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.menu a{display:block;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
.menu a:hover{background:var(--panel2)}
.menu small{display:block;color:var(--mute);font-weight:400;font-size:12px}
.icon{background:transparent;color:var(--ink);padding:7px 9px;display:grid;place-items:center;border-radius:9px}
.icon:hover:not(:disabled){background:var(--panel);filter:none}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-left:6px}
.seg button{background:transparent;color:var(--mute);border-radius:0;padding:5px 10px;font-weight:600;font-size:13px}
.seg button.on{background:var(--panel2);color:var(--ink)}

/* ===== Cartes ===== */
.card{background:var(--panel);border-radius:var(--r);padding:20px;min-width:0}
.card>h2{margin:0 0 12px;font-size:16px;font-weight:600}
.page{display:none}
.page.on{display:block}

/* ===== Carte calculatrice ===== */
.hero{display:grid;grid-template-columns:170px minmax(0,1fr) auto;column-gap:18px;align-items:center;padding:20px 28px 20px 0;min-height:150px}
.calc{width:104px;justify-self:center}
.calc img{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 12px rgba(0,0,0,.28))}
.hbody{min-width:0}
.hbody h1{margin:0 0 10px;font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:10px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;padding:3px 14px;border-radius:8px;font-weight:700;font-size:16px;line-height:1.7;white-space:nowrap}
.b-gray{background:#c8c9c9;color:#2b2d2d}
.b-red{background:#c63535;color:#ffe9e9}
.b-yel{background:#d9b71d;color:#3a3100}
.sub{margin:12px 0 0;color:var(--mute);font-size:13.5px}
.sub b{color:var(--ink);font-weight:600}
.act{align-self:end}
.cta{padding:9px 16px;border-radius:9px;font-weight:700;font-size:14px;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.hero .bar,.hero .pt{grid-column:1/-1;margin-left:28px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:18px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
.bar.done i{background:var(--ok)}
.pt{font-size:13px;color:var(--mute);margin-top:8px}
.pt:empty{display:none}

/* ===== Projets ===== */
.ptitle{margin:56px 0 18px;font-size:25px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.proj{display:block;background:var(--panel);border-radius:16px;padding:20px 24px;color:var(--ink);text-decoration:none;transition:background .12s}
.proj:hover{background:var(--panel2)}
.proj b{display:block;font-size:16px;font-weight:600;margin-bottom:6px}
.st{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:15px}
.st svg{flex:none}
.st i{font-style:normal;margin-right:10px}
hr.end{border:0;border-top:1px solid var(--line);margin:40px 0 0}
.endsp{height:40px}

/* ===== Éditeur de thème ===== */
label.f{font-size:12.5px;color:var(--mute);display:flex;flex-direction:column;gap:5px;font-weight:600}
select,input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--ink);font-weight:400}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:12px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sw{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;line-height:1.25;cursor:pointer;background:var(--panel2)}
.sw:hover{border-color:var(--acc)}
.sw input{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.sw small{color:var(--mute);font-family:var(--mono)}
.ic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ic{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--mute);background:var(--panel2)}
.ic .th,.wall .th{display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/14px 14px;border-radius:8px;margin-bottom:7px;cursor:pointer;overflow:hidden;color:var(--mute);font-size:12px}
.ic .th{height:62px}
.wall .th{aspect-ratio:4/3;width:100%;margin-bottom:10px}
.ic img,.wall img{max-width:100%;max-height:100%;image-rendering:pixelated}
.ic button,.wall button{padding:3px 9px;font-size:12px;background:var(--acc-s);color:var(--acc-t)}
.wall{max-width:320px}

#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;font-size:13px;max-width:90vw;z-index:30}
#toast.show{opacity:1;transform:translate(-50%,0)}

#tmgr{margin:12px 0}
#tmgr h2 small{color:var(--mute);font-weight:400;font-size:13px}
#tmgr h2.sec{margin-top:20px}
.thead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;margin-bottom:16px}
.thead h2{margin:0}
.tmeter{flex:0 1 320px;min-width:230px}
.tmtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;color:var(--mute);margin-bottom:7px}
.tmtop b{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--okt);transition:color .2s}
.tmbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tmbar i{display:block;height:100%;width:0;border-radius:inherit;background:var(--ok);transition:width .25s,background .2s}
.tmeter.over .tmtop b{color:var(--bad)}
.tmeter.over .tmbar i{background:var(--bad)}
.twarn{margin:0 0 14px;padding:9px 13px;border-radius:10px;background:var(--bad-s);color:var(--bad);font-size:13px;font-weight:500}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tcard{position:relative;display:flex;border:1.5px solid var(--line);border-radius:14px;background:var(--panel2);transition:border-color .12s,background .12s,box-shadow .12s}
.tcard:hover{border-color:var(--mute)}
.tcard.on{border-color:var(--acc);background:var(--acc-s);box-shadow:0 0 0 3px var(--acc-s)}
.tsel{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 40px 10px 10px;background:transparent;color:var(--ink);border-radius:13px;text-align:left;font-weight:500}
.tsel:hover:not(:disabled){filter:none}
.tsel:focus-visible,.tdel:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tth{flex:none;width:58px;height:44px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.tth i{display:block}
.tth .tb{flex:0 0 20%}
.tth .tw{flex:1;background-position:center;background-size:cover}
.tinfo{display:flex;flex-direction:column;min-width:0;line-height:1.35}
.tinfo b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tinfo small{color:var(--mute);font-family:var(--mono);font-size:12px}
.tdel{position:absolute;top:7px;right:7px;width:26px;height:26px;padding:0;border-radius:8px;background:transparent;color:var(--mute);font-size:18px;line-height:1;opacity:.7}
.tcard:hover .tdel,.tdel:focus-visible{opacity:1}
.tdel:hover:not(:disabled){background:var(--bad-s);color:var(--bad);filter:none;opacity:1}
.plist{display:flex;gap:8px;flex-wrap:wrap}
.tact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tact button{display:inline-flex;align-items:center;gap:7px}
.tact .grow{flex:1}
#p-theme .act{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px 14px}
.tsize{font-family:var(--mono);font-size:13px;font-weight:600;padding:6px 13px;border-radius:99px;color:var(--okt);background:var(--ok-s);white-space:nowrap;transition:color .2s,background .2s}
.tsize.over{color:var(--bad);background:var(--bad-s)}
.pre::before{content:'+ '}
.pre.done::before{content:'✓ '}
.hint{margin:16px 0 0;color:var(--mute);font-size:13px}

@media (max-width:1100px){.cols{grid-template-columns:1fr}}
@media (max-width:760px){
  .hero{grid-template-columns:96px minmax(0,1fr);padding:18px 18px 18px 0;row-gap:16px}
  .calc{width:72px}
  .act{grid-column:1/-1;justify-self:end;padding-left:18px}
  .hero .bar,.hero .pt{margin-left:18px}
  .hbody h1{font-size:20px}
  .projects{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .seg{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">SaltyOS</div>
  <nav role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-p="os">SaltyOS</button>
    <button class="tab" role="tab" aria-selected="false" data-p="app">ABLauncher</button>
    <button class="tab" role="tab" aria-selected="false" data-p="theme" data-i="tTheme"></button>
  </nav>
  <div class="gh">
    <button class="tab" id="ghBtn" aria-haspopup="true" aria-expanded="false">GitHub <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
    <div class="menu" id="ghMenu" hidden>
      <a href="https://github.com/SaltyMold/Salty-OS" target="_blank" rel="noopener">Salty-OS<small>SaltyMold/Salty-OS</small></a>
      <a href="https://github.com/SaltyMold/ABLauncher-Numworks/" target="_blank" rel="noopener">ABLauncher<small>SaltyMold/ABLauncher-Numworks</small></a>
      <a href="https://github.com/SaltyMold/Salty-OS-Installer" target="_blank" rel="noopener">Salty-OS Installer<small>SaltyMold/Salty-OS-Installer</small></a>
    </div>
  </div>
  <span class="sp"></span>
  <button class="icon" id="themeBtn" aria-label="Thème / Theme"></button>
  <div class="seg"><button data-l="fr">FR</button><button data-l="en">EN</button></div>
</div></header>

<main class="wrap">
  <section class="page on" id="p-os">
      <div class="hero card">
        <div class="calc"></div>
        <div class="hbody">
          <h1 class="devTitle"></h1>
          <div class="badges"><span class="badge b-gray bState"></span><span class="badge b-red bModel"></span><span class="badge b-yel bSerial"></span></div>
          <p class="sub"><span data-i="latest"></span> <b id="osTag">…</b></p>
        </div>
        <div class="act"><button class="cta connectBtn" data-i="connect"></button><button class="cta" id="go-os" hidden data-i="installOS"></button></div>
        <div class="bar" id="b-os"><i></i></div><div class="pt" id="t-os"></div>
      </div>
  </section>

  <section class="page" id="p-app">
      <div class="hero card">
        <div class="calc"></div>
        <div class="hbody">
          <h1 class="devTitle"></h1>
          <div class="badges"><span class="badge b-gray bState"></span><span class="badge b-red bModel"></span><span class="badge b-yel bSerial"></span></div>
          <p class="sub"><span data-i="latest"></span> <b id="abTag">…</b></p>
        </div>
        <div class="act"><button class="cta connectBtn" data-i="connect"></button><button class="cta" id="go-app" hidden data-i="installApp"></button></div>
        <div class="bar" id="b-app"><i></i></div><div class="pt" id="t-app"></div>
      </div>
  </section>

  <section class="page" id="p-theme">
      <div class="hero card">
        <div class="calc"></div>
        <div class="hbody">
          <h1 class="devTitle"></h1>
          <div class="badges"><span class="badge b-gray bState"></span><span class="badge b-red bModel"></span><span class="badge b-yel bSerial"></span></div>
          <p class="sub"><span data-i="themeHint"></span></p>
        </div>
        <div class="act"><button class="cta connectBtn" data-i="connect"></button><span class="tsize" id="tSize" role="status" aria-live="polite"></span><button class="cta" id="go-theme" hidden></button></div>
        <div class="bar" id="b-theme"><i></i></div><div class="pt" id="t-theme"></div>
      </div>
    <div class="card" id="tmgr">
      <div class="thead">
        <h2><span data-i="myThemes"></span> <small id="tCount"></small></h2>
        <div class="tmeter" id="tMeter" role="progressbar" aria-valuemin="0" aria-valuemax="2048" aria-valuenow="0">
          <div class="tmtop"><span data-i="space"></span><b id="tMeterTxt"></b></div>
          <div class="tmbar"><i id="tMeterFill"></i></div>
        </div>
      </div>
      <p class="twarn" id="tOver" role="alert" hidden></p>
      <div class="tlist" id="tlist"></div>
      <div class="tact">
        <button class="ghost" id="tNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i="newTheme"></span></button>
        <button class="ghost" id="tDup"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg><span data-i="dup"></span></button>
        <span class="grow"></span>
        <button class="ghost" id="imp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg><span data-i="imp"></span></button><input type="file" id="in-zip" accept=".zip" multiple hidden>
        <button class="ghost" id="exp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><span data-i="exp"></span></button>
      </div>
      <h2 class="sec" data-i="presets"></h2>
      <div class="plist" id="presets"></div>
      <p class="hint" data-i="themeNote"></p>
    </div>
    <div class="cols">
      <div class="stack">
        <div class="card">
          <div class="grid2">
            <label class="f"><span data-i="name"></span><input type="text" id="tName" maxlength="15"></label>
            <label class="f"><span data-i="circle"></span><select id="tCircle"></select></label>
          </div>
          <label class="chk"><input type="checkbox" id="tHover"> <span data-i="hover"></span></label>
        </div>
        <div class="card">
          <h2 data-i="palette"></h2>
          <div class="sw-grid" id="pal"></div>
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <h2 data-i="wall"></h2>
          <div class="wall"><div class="th" id="wallTh" data-t="wall"></div><button data-t="wall" data-i="choose"></button> <button data-c="wall">×</button></div>
        </div>
        <div class="card">
          <h2><span data-i="icons"></span> <small id="icCount"></small></h2>
          <div class="ic-grid" id="icons"></div>
        </div>
      </div>
    </div>
    <input type="file" id="in-img" accept="image/*" hidden>
  </section>

  <h2 class="ptitle" data-i="projects"></h2>
  <div class="projects" id="projects"></div>
  <hr class="end"><div class="endsp"></div>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const IDS=[{vendorId:0x0483,productId:0xDF11},{vendorId:0x0483,productId:0xA291},{vendorId:0x0483,productId:0xA51A}];
const PAGE=0x1000, THEME_ADDR=0x901F0000, THEME_MAX=2*1024*1024;
let dev=null,busy=false,devModel=null,devSerial='';

const out=(r,v,d)=>dev.controlTransferOut({requestType:'class',recipient:'interface',request:r,value:v,index:0},d||new Uint8Array());
async function status(){
  const r=await dev.controlTransferIn({requestType:'class',recipient:'interface',request:3,value:0,index:0},6);
  if(!r.data||r.data.byteLength<6)throw new Error(tr('dfuErr'));
  const d=r.data,s=d.getUint8(4);await sleep(d.getUint8(1)|d.getUint8(2)<<8|d.getUint8(3)<<16);return s;
}
async function cmd(code,addr,what){
  const p=new DataView(new ArrayBuffer(5));p.setUint8(0,code);p.setUint32(1,addr>>>0,true);
  await out(1,0,new Uint8Array(p.buffer));
  if(await status()!==4||await status()!==5)throw new Error(tr('dfuErr')+' '+hex(addr));
}
async function writeBlock(addr,chunk){
  await cmd(0x21,addr,'Adresse');
  await out(1,2,chunk);
  if(await status()!==4||await status()!==5)throw new Error(tr('dfuErr')+' '+hex(addr));

async function flash(elements,bar,txt,leaveAt){
  if(!dev)throw new Error(tr('off'));
  if(busy)return;busy=true;refresh();
  const B=$('#b-'+bar),T=$('#t-'+bar),F=B.firstElementChild;B.className='bar on';
  const pages=new Set();let total=0;
  elements.forEach(e=>{total+=e.data.length;for(let p=Math.floor(e.address/PAGE)*PAGE;p<=Math.floor((e.address+e.data.length-1)/PAGE)*PAGE;p+=PAGE)pages.add(p)});
  let lock=null;try{lock=await navigator.wakeLock?.request('screen')}catch(_){}
  const warn=e=>{e.preventDefault();e.returnValue=''};addEventListener('beforeunload',warn);
  try{
    let n=0;const list=[...pages].sort((a,b)=>a-b);
    for(const p of list){await cmd(0x41,p,'Effacement');n++;F.style.width=(n/list.length*30)+'%';T.textContent=tr('erase')+' '+Math.round(n/list.length*100)+' %'}
    let w=0;
    for(const e of elements)for(let o=0;o<e.data.length;o+=1024){
      const c=e.data.slice(o,o+1024);await writeBlock(e.address+o,c);w+=c.length;
      F.style.width=(30+w/total*70)+'%';T.textContent=tr('write')+' '+Math.round(w/total*100)+' %';
    }
    if(leaveAt){try{await cmd(0x21,leaveAt,'Sortie DFU');await out(1,0);await status()}catch(_){}}B.classList.add('done');T.textContent=tr('done');
  }catch(e){T.textContent=tr('fail')+e.message}

}
function parseDfu(buf){

    o+=6+1+4+255;const size=v.getUint32(o,true);o+=4;const cnt=v.getUint32(o,true);o+=4;const end=o+size;

const rel={};
function latest(repo){return rel[repo]||(rel[repo]=fetch('https://api.github.com/repos/'+repo+'/releases/latest').then(r=>{if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}))}
async function getAsset(repo,name){
  try{const r=await fetch(ASSETS+name,{cache:'no-cache'});if(r.ok){const b=await r.arrayBuffer();if(b.byteLength&&new Uint8Array(b)[0]!==60)return b}}catch(_){}
  const a=(await latest(repo)).assets.find(x=>x.name===name);
  if(!a)throw new Error(name+tr('notFound'));
  const r=await fetch(a.url,{headers:{Accept:'application/octet-stream'}});
  if(!r.ok)throw new Error(tr('dlFail')+' ('+r.status+')');return r.arrayBuffer();
}

/* ===== Lecture mémoire DFU et infos de la calculatrice ===== */
async function readMem(addr,len){
  await cmd(0x21,addr,'Adresse');try{await out(6,0);await status()}catch(_){}
  const res=new Uint8Array(len);let o=0,blk=2;
  while(o<len){const r=await dev.controlTransferIn({requestType:'class',recipient:'interface',request:2,value:blk++,index:0},Math.min(1024,len-o));
    if(r.status!=='ok'||!r.data.byteLength)throw new Error(tr('readFail'));
    res.set(new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength),o);o+=r.data.byteLength}
  try{await out(6,0)}catch(_){}return res;
}
const M={F00D:[0xF0,0x0D,0xC0,0xDE],FEED:[0xFE,0xED,0xC0,0xDE],BAD:[0xBA,0xDB,0xEE,0xEF]};
const has=(a,m,o=0)=>a.length>=o+4&&m.every((x,i)=>a[o+i]===x);
async function readInfo(){
  const FL=0x08000000,RAM=devModel==='n0120'?0x24000000:0x20000000;
  for(const[off,sz]of[[428,24],[452,32]]){const h=await readMem(FL+off,sz);if(has(h,M.F00D)&&has(h,M.F00D,h.length-4))throw new Error(tr('noExt'))}
  const si=await readMem(RAM,16);if(!has(si,M.BAD)||!has(si,M.BAD,12))throw new Error('Infos de slot corrompues.');
  const uA=new DataView(si.buffer).getUint32(8,true),uh=await readMem(uA,48),v=new DataView(uh.buffer);
  if(!has(uh,M.FEED))throw new Error(tr('badHdr'));
  const f={extStart:v.getUint32(20,true),extEnd:v.getUint32(24,true)};let n=28;
  if(!has(uh,M.FEED,n)){f.ramStart=v.getUint32(28,true);f.ramEnd=v.getUint32(32,true);n=36;if(!has(uh,M.FEED,n))n=44}
  if(!has(uh,M.FEED,n)||f.ramStart===undefined)throw new Error(tr('noExt'));
  f.tramp=uA+n+4+8;return f;
}

function modelOf(d){return 'n'+((d.deviceVersionMajor<<8)|(d.deviceVersionMinor<<4)|d.deviceVersionSubminor).toString(16).padStart(4,'0')}
function refresh(){
  const ok=!!dev,all=s=>document.querySelectorAll(s);

  let calcImg='src/calculator_off.png';
  if(ok){

  $('#go-app').disabled=busy;$('#go-theme').disabled=busy||!THEMES.length||sizeOver;$('#go-theme').textContent=tr('installThemes')+' ('+THEMES.length+')';
  all('.connectBtn').forEach(b=>b.hidden=ok);
  all('.devTitle').forEach(e=>e.textContent=ok?devName:tr('someone'));
  all('.bState').forEach(e=>e.textContent=busy?tr('busy'):ok?tr('on'):tr('off'));
  all('.bModel').forEach(e=>e.textContent=tr('model')+' '+(ok?devModel.toUpperCase():'N/A'));
  all('.bSerial').forEach(e=>e.textContent=tr('serial')+' '+(ok?(devSerial||'—'):'N/A'));
}
const doConnect=async()=>{
  if(!navigator.usb){toast(tr('noUsb'));return}
  try{
    const d=await navigator.usb.requestDevice({filters:IDS});
    await d.open();await d.selectConfiguration(d.configurations[0].configurationValue);await d.claimInterface(0);
    dev=d;devModel=modelOf(d);devName=d.productName||'NumWorks';devSerial=d.serialNumber||'';refresh();
    navigator.usb.ondisconnect=e=>{if(e.device===dev){dev=null;devModel=null;devSerial='';refresh();toast(tr('disc'))}};
  }catch(e){if(e.name!=='NotFoundError')toast(tr('connFail')+e.message)}
};
document.querySelectorAll('.connectBtn').forEach(b=>b.onclick=doConnect);

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=~0;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return ~c>>>0};
function zip(files){
  const enc=new TextEncoder(),loc=[],cen=[];let off=0;
  for(const f of files){const n=enc.encode(f.path),crc=crc32(f.data),
    h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint16(12,33,true);h.setUint32(14,crc,true);h.setUint32(18,f.data.length,true);h.setUint32(22,f.data.length,true);h.setUint16(26,n.length,true);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint16(14,33,true);c.setUint32(16,crc,true);c.setUint32(20,f.data.length,true);c.setUint32(24,f.data.length,true);c.setUint16(28,n.length,true);c.setUint32(42,off,true);
    loc.push(new Uint8Array(h.buffer),n,f.data);cen.push(new Uint8Array(c.buffer),n);off+=30+n.length+f.data.length}
  const cd=cat(cen),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cd.length,true);e.setUint32(16,off,true);
  return cat([...loc,cd,new Uint8Array(e.buffer)]);
}
async function unzip(buf){
  const v=new DataView(buf),b=new Uint8Array(buf),td=new TextDecoder(),res=new Map();let e=b.length-22;
  while(e>=0&&v.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error(tr('badZip'));
  let p=v.getUint32(e+16,true);const cnt=v.getUint16(e+10,true);
  for(let i=0;i<cnt;i++){const m=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),name=td.decode(b.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;const st=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true);let d=b.subarray(st,st+cs);
    if(m===8)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());else if(m!==0)throw new Error(tr('badZip'));
    res.set(name,d)}
  return res;
}
$('#exp').onclick=()=>{

    {path:nm+'/palette.txt',data:enc(T.pal.map(p=>p.n+' 0x'+p.v.slice(1)).join('\n'))},
    {path:nm+'/variables.txt',data:enc('defaultCircleLevel '+T.circle+'\nisAppNameBackgroundHover '+(T.hover?1:0))}];
  if(T.wall)f.push({path:nm+'/wallpaper.png',data:T.wall.png});
  T.icons.forEach((im,i)=>im&&f.push({path:nm+'/'+ICN[i]+'_icon.png',data:im.png}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([zip(f)],{type:'application/zip'}));a.download=nm+'.zip';a.click();

async function themeFromZip(buf){
  const files=await unzip(buf),key=[...files.keys()].find(k=>/(^|\/)name\.txt$/.test(k)&&!k.startsWith('__MACOSX'));
  if(!key)throw new Error(tr('badZip'));
  const dir=key.slice(0,key.length-8),get=n=>files.get(dir+n),td=new TextDecoder(),nt={src:null};
  nt.name=td.decode(get('name.txt')).trim().split(/\r?\n/)[0].trim().slice(0,15);
  if(!get('palette.txt'))throw new Error(tr('badZip'));
  nt.pal=parsePal(td.decode(get('palette.txt')));if(!nt.pal.length||nt.pal.length>64)throw new Error(tr('badPal'));
  nt.circle=0;nt.hover=false;
  if(get('variables.txt'))for(const l of td.decode(get('variables.txt')).split(/\r?\n/)){const m=l.trim().match(/^(\S+)\s+(\d+)$/);if(!m)continue;
    if(m[1]==='defaultCircleLevel')nt.circle=Math.min(7,+m[2]);if(m[1]==='isAppNameBackgroundHover')nt.hover=+m[2]===1}
  nt.wall=get('wallpaper.png')?await toImg(new Blob([get('wallpaper.png')]),320,240):null;
  nt.icons=await Promise.all(ICN.map(n=>get(n+'_icon.png')?toImg(new Blob([get(n+'_icon.png')]),55,56):null));
  return nt;
}

function select(i){cur=i;T=THEMES[i];render()}
function addTheme(t){
  THEMES.push(t);select(THEMES.length-1);refresh();return true;
}
$('#tlist').onclick=e=>{
  const s=e.target.closest('[data-ts]'),d=e.target.closest('[data-td]');

    refresh()}
};
/* Thème de base = themes/epsilon.zip (nommé « Epsilon ») */
async function epsilonTheme(){const t=await themeFromZip(await getZip('epsilon'));t.name='Epsilon';t.src=null;return t}
async function loadDefault(){
  try{const t=await epsilonTheme();
    if(THEMES.length===1&&THEMES[0]._ph){THEMES[0]=t;select(0);refresh()}}catch(_){}
}
$('#tNew').onclick=async()=>{

const PRESETS=[{id:'omega',name:'Omega'},{id:'kawaii',name:'Kawaii'}];
$('#presets').innerHTML=PRESETS.map(p=>'<button class="ghost pre" data-pr="'+p.id+'">'+escH(p.name)+'</button>').join('');
const _zc={};
async function getZip(id){
  if(_zc[id])return _zc[id];
  const r=await fetch('themes/'+id+'.zip',{cache:'no-cache'});if(!r.ok)throw 0;
  const buf=await r.arrayBuffer();if(new Uint8Array(buf.slice(0,2)).join()!=='80,75')throw 0;
  return _zc[id]=buf;
}
async function loadPreset(p,btn){
  btn.disabled=true;let buf;
  try{buf=await getZip(p.id)}
  catch(_){toast(tr('presetFail')+'themes/'+p.id+'.zip');btn.disabled=false;return}
  try{const t=await themeFromZip(buf);t.src=p.id;addTheme(t)}catch(x){toast(x.message)}
  btn.disabled=false;
}
$('#presets').onclick=e=>{const b=e.target.closest('[data-pr]');if(b)loadPreset(PRESETS.find(p=>p.id===b.dataset.pr),b)};

$('#in-zip').onchange=async e=>{const fs=[...e.target.files];e.target.value='';
  for(const f of fs){try{if(!addTheme(await themeFromZip(await f.arrayBuffer())))break}catch(x){toast(x.message)}}};

function makeWall(im){const rows=16,cnt=Math.ceil(im.h/rows),ch=[];
  for(let k=0;k<cnt;k++)ch.push(lz4(im.rgb.subarray(k*rows*im.w*2,Math.min(im.h,(k+1)*rows)*im.w*2)));
  let o=0;const offs=ch.map(c=>{const r=o;o+=c.length;return r});
  return cat([u32(im.w,im.h,rows,cnt),u32(...offs),u32(...ch.map(c=>c.length)),...ch])}

    flash([{address:THEME_ADDR,data:bin}],'theme','');

};
